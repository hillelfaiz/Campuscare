name: campus_care
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.0
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2  
  crop_your_image: ^2.0.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/image/LOGO.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/image/
